{{- $fullName := include "webapp-base.fullname" . -}}
{{- $labels := include "webapp-base.labels" . -}}
{{- $selectorLabels := include "webapp-base.selectorLabels" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.service.extraPorts }}
    {{- toYaml .Values.service.extraPorts | nindent 4 }}
    {{- end }}
  selector:
    {{- $selectorLabels | nindent 4 }}
{{ range .Values.extraServices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullName }}-{{ .name }}
  labels:
    {{- $labels | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .type }}
  ports:
  {{- toYaml .ports | nindent 4 }}
  selector:
    {{- $selectorLabels | nindent 4 }}
    {{- with .selectorLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{ end }}

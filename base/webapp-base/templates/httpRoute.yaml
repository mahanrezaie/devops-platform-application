{{- $fullName := include "webapp-base.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- if .Values.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
spec:
  parentRefs:
  {{- toYaml .Values.httpRoute.parentRefs | nindent 6 }}
  hostnames:
  {{- toYaml .Values.httpRoute.hostnames | nindent 6 }}
  rules:
  - matches:
    {{- range .Values.httpRoute.paths }}
    - path:
        type: {{ .pathType }}
        value: {{ .path }}
    {{- end }}
    backendRefs:
    - kind: Service
      name: {{ $fullName }}
      port: {{ $svcPort }}
{{- end }}
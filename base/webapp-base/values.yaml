# Default values for webapp-base.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

deploymentMode: "Deployment"

replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 25%

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

initContainers: []
#  - name: init-myservice
#    image: busybox
#    imagePullPolicy: IfNotPresent
#    command: ['sh', '-c', 'until nslookup myservice; do echo waiting for myservice; sleep 2; done;']

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

extraServices: []
# - name: metrics
#   type: NodePort
#   ports:
#     - port: 8080
#       targetPort: 8080
#       protocol: TCP
#       nodePort: 30080
#   labels:
#    metrics: enabled


ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific
  #   servicePort: 8080
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
  traefik:
    httpsRedirect: false

httpRoute:
  enabled: false
  hostnames: []
  # - chart-example.local
  parentRefs: []
  # - name: private-gateway
  #   namespace: infra
  paths:
  - path: /
    pathType: ImplementationSpecific

exec:
  command: []
  args: []

volumes: []
# - name: vol-gbanu
#   persistentVolumeClaim:
#     claimName: pvc-gbanu

volumeMounts: []
# - mountPath: /app/temp
#   name: vol-gbanu

persistentVolumeClaims: []
# - name: pvc-gbanu
#   accessModes:
#     - ReadWriteOnce
#   capacity: 1Gi
#  storageClassName: topolvm-provisioner

env: {}
#  MY_ENV_VAR: my_env_value
#  MY_SECOND_VAR: my_second_value

secretEnv: []
#  - name: MY_ENV_VAR
#    secretName: my-secret
#    key: my-secret-key

envFrom: []
#  - my-configmap-name

# If you want to set env vars into a file
envFilePath: null

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

startupProbe:
  enabled: false
  path: /
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

preUpgradeJobs: []
# - name: hello
#   image: nginx:latest
#   command: ["echo"]
#   args: ["hello"]

metrics:
  serviceMonitor:
    enabled: false
    namespace: monitoring
    labels: {}
    selectorLabels: {}
    endpoints: []
    # - path: /metrics
    #   targetPort: 8080
    #   interval: 30s  

hostNetwork: false

extraContainers: []

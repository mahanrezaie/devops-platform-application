apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ip-lookup-web
  namespace: kube-prometheus-stack
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/instance: kube-prometheus-stack
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - devops-platform-stage-ip-lookup

  selector:
    matchLabels:
      app.kubernetes.io/name: web
      app.kubernetes.io/instance: devops-platform-stage-ip-lookup
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s

web:
  image:
    repository: ghcr.io/mahanrezaie/ip-lookup-api
    tag: "stage-e91bede"
  service:
    port: 8000
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 200m
      memory: 200Mi
  ingress:
    enabled: true
    className: traefik
    hosts:
      - host: ip-lookup.local
        paths:
          - path: /
            pathType: ImplementationSpecific
  secretEnv:
    - name: DATABASE_URL
      secretName: postgres-url
      key: database_url
